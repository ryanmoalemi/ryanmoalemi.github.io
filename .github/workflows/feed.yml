name: Build feed
on:
  push:
    branches: [main]
    paths: ["blog/**", "*.html", "scripts/build_feed.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_feed.py
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add -A && git commit -m "Rebuild feed.xml" && git push
          fi
